name: Check styling

on: [push, pull_request]

jobs:
    style:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: mbstring
                    coverage: none

            -   name: Install composer dependencies
                uses: ramsey/composer-install@v4

            -   name: Check style
                run: composer format-check
